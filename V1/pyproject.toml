[project]
name = "desktop"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bcrypt>=5.0.0",
    "pyside6>=6.12.0",
    "reportlab>=5.1.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-qt>=4.5.0",
    "ruff>=0.17.5",
]


[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
qt_qpa_platform = "offscreen"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
